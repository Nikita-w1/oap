<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Каталог ресурсів</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

<div class="container">

  <h1>Каталог навчальних ресурсів</h1>

  <h2 id="formTitle">Новий ресурс</h2>

  <form id="form">

    <div class="field">
      <label>Назва</label>
      <input id="title">
      <p class="error" id="titleError"></p>
    </div>

    <div class="field">
      <label>Посилання</label>
      <input id="url">
      <p class="error" id="urlError"></p>
    </div>

    <div class="field">
      <label>Тип</label>
      <select id="type">
        <option value="">Оберіть</option>
        <option value="Video">Відео</option>
        <option value="Article">Стаття</option>
        <option value="Course">Курс</option>
        <option value="Book">Книга</option>
        <option value="Tool">Інструмент</option>
      </select>
      <p class="error" id="typeError"></p>
    </div>

    <div class="field">
      <label>Опис</label>
      <textarea id="desc"></textarea>
      <p class="error" id="descError"></p>
    </div>

    <div class="field">
      <label>Автор</label>
      <input id="author">
      <p class="error" id="authorError"></p>
    </div>

    <div class="buttons">
      <button type="submit" id="submitBtn">Зберегти</button>
      <button type="button" id="cancelEdit" class="hidden">Скасувати</button>
    </div>

  </form>

  <!-- Пошук -->
  <input id="searchInput" placeholder="Пошук..." class="search">

  <!-- Кнопка сорту -->
  <button id="toggleSort">Змінити напрям сортування</button>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th data-colname="title">Назва</th>
        <th>Посилання</th>
        <th data-colname="type">Тип</th>
        <th data-colname="author">Автор</th>
        <th>Дії</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>

</div>

</body>
</html>
